name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and JavaScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: alpaca-trendlinien
    env:
      TORI_AUTO_ENABLED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alpaca-trendlinien/requirements.txt
      - name: Node.js 24 (tests only)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: JavaScript tests
        run: node --test tests/test_geometry.cjs tests/test_snapshot_view.cjs tests/test_measurements.cjs
